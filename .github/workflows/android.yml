name: Build Android app (APK)
# Builds the Capacitor Android app and publishes the APK as the "android-latest" release,
# so it can be downloaded and installed straight from the phone.
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'VERSION', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle (the Gradle download and libraries)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install dependencies
        # --ignore-scripts: skips native downloads the APK build does not need (e.g. sharp for @capacitor/assets,
        # whose download from GitHub can time out and fail the whole build)
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund --ignore-scripts && break; echo "npm install failed, retrying ($i)"; sleep 10; done
          test -d node_modules/@capacitor/cli
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Read the app version
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Release tag is always X.Y.Z (1.19 -> v1.19.0): app versions up to 1.1.8 only recognize such tags
          if [[ "$v" =~ ^[0-9]+\.[0-9]+$ ]]; then echo "tag=v$v.0" >> "$GITHUB_OUTPUT"; else echo "tag=v$v" >> "$GITHUB_OUTPUT"; fi
      - name: Restore the signing key from GitHub secrets
        env:
          KS: ${{ secrets.HPJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/hpj-release.jks"
            echo "HPJ_KEYSTORE=$RUNNER_TEMP/hpj-release.jks" >> "$GITHUB_ENV"
            echo "Signing key: from secrets"
          else
            echo "::error::The HPJ_KEYSTORE_BASE64 secret is missing – the APK must be signed with the app's key"; exit 1
          fi
      - name: Build APK
        working-directory: android
        env:
          HPJ_STORE_PASSWORD: ${{ secrets.HPJ_STORE_PASSWORD }}
          HPJ_KEY_ALIAS: ${{ secrets.HPJ_KEY_ALIAS }}
          HPJ_KEY_PASSWORD: ${{ secrets.HPJ_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Downloads (Gradle itself, libraries) sometimes time out on the runner: try up to 3 times
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon && break; echo "Gradle build failed, retrying ($i)"; sleep 20; done
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hapoel-jerusalem-v${{ steps.ver.outputs.version }}
          path: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
      - name: Write the release notes (what's new, from CHANGELOG.md)
        run: |
          node scripts/release-notes.js "${{ steps.ver.outputs.version }}" > release-notes.md || printf 'אפליקציית האנדרואיד של הפועל ירושלים – גרסה %s.\n' "${{ steps.ver.outputs.version }}" > release-notes.md
          cat release-notes.md
      - name: Publish the release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: גרסה ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
      - name: Remove the old unversioned release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
