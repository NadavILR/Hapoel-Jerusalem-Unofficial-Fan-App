name: Build Android app (APK)
# Builds the Capacitor Android app and publishes the APK as the "android-latest" release,
# so it can be downloaded and installed straight from the phone.
# From main: a regular release (the app offers it as an update). From any other branch: a pre-release
# (tag vX.Y-beta, not "latest") that the app never offers – it is only downloadable from GitHub.
on:
  push:
    branches: [main, ccr-14a15d85-izwe4r]
    paths: ['www/**', 'android/**', 'VERSION', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Read the app version
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Release tag = the version as it is: 1.132 -> v1.132 (until 1.131 it was v1.131.0). The app's update check
          # accepts both forms (releases/latest and the releases.atom fallback); only versions up to 1.1.8 wanted X.Y.Z
          t="v$v"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=$t" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"; echo "title=גרסה $v" >> "$GITHUB_OUTPUT"
          else
            # Pre-release: the "-beta" tag is never offered as an update (releases/latest skips pre-releases, and the
            # app's releases.atom fallback only accepts tags like v1.132 / v1.2.3)
            echo "tag=$t-beta" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"; echo "title=גרסה $v (ניסיונית)" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the signing key from GitHub secrets
        env:
          KS: ${{ secrets.HPJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/hpj-release.jks"
            echo "HPJ_KEYSTORE=$RUNNER_TEMP/hpj-release.jks" >> "$GITHUB_ENV"
            echo "Signing key: from secrets"
          else
            echo "::error::The HPJ_KEYSTORE_BASE64 secret is missing – the APK must be signed with the app's key"; exit 1
          fi
      - name: Build APK
        working-directory: android
        env:
          HPJ_STORE_PASSWORD: ${{ secrets.HPJ_STORE_PASSWORD }}
          HPJ_KEY_ALIAS: ${{ secrets.HPJ_KEY_ALIAS }}
          HPJ_KEY_PASSWORD: ${{ secrets.HPJ_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hapoel-jerusalem-v${{ steps.ver.outputs.version }}
          path: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
      - name: Write the release notes (what's new, from CHANGELOG.md)
        run: |
          node scripts/release-notes.js "${{ steps.ver.outputs.version }}" > release-notes.md || printf 'אפליקציית האנדרואיד של הפועל ירושלים – גרסה %s.\n' "${{ steps.ver.outputs.version }}" > release-notes.md
          if [ "${{ steps.ver.outputs.pre }}" = "true" ]; then
            # A pre-release is not offered inside the app
            sed -i 's/ מי שהאפליקציה כבר מותקנת אצלו יקבל את העדכון גם מתוך האפליקציה\./ זו גרסה ניסיונית: היא מוצעת כעדכון בתוך האפליקציה רק למי שבחר בהגדרות לקבל גם גרסאות ניסיון (בטא)./' release-notes.md
          fi
          cat release-notes.md
      - name: Publish the release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.title }}
          body_path: release-notes.md
          files: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
          prerelease: ${{ steps.ver.outputs.pre == 'true' }}
          make_latest: ${{ steps.ver.outputs.pre != 'true' }}
      - name: Remove the old unversioned release
        if: steps.ver.outputs.pre != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
