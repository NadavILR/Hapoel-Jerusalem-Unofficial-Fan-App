name: Build Android app (APK)
# Builds the Capacitor Android app and publishes the APK as the "android-latest" release,
# so it can be downloaded and installed straight from the phone.
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hapoel-jerusalem.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hapoel-jerusalem-apk
          path: hapoel-jerusalem.apk
      - name: Publish as the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: אפליקציית אנדרואיד – הגרסה האחרונה
          body: |
            להתקנה: מורידים את hapoel-jerusalem.apk מהטלפון ופותחים אותו (צריך לאשר "התקנה ממקורות לא ידועים").
            נבנה מ-${{ github.sha }}.
          files: hapoel-jerusalem.apk
          make_latest: true
