name: Build Android app (APK)
# Builds the Capacitor Android app and publishes the APK as the "android-latest" release,
# so it can be downloaded and installed straight from the phone.
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'VERSION', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Copy the web app into the Android project
        run: npx cap sync android
      - name: Read the app version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hapoel-jerusalem-v${{ steps.ver.outputs.version }}
          path: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
      - name: Publish the release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: גרסה ${{ steps.ver.outputs.version }}
          body: |
            אפליקציית האנדרואיד של הפועל ירושלים – גרסה ${{ steps.ver.outputs.version }}.
            להתקנה: מורידים מהטלפון את hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk ופותחים אותו (מתקינים מעל הגרסה הקיימת).
            נבנה מ-${{ github.sha }}.
          files: hapoel-jerusalem-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
      - name: Remove the old unversioned release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete android-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
