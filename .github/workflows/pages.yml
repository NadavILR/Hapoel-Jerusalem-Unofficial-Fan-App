name: Deploy app to GitHub Pages
# Publishes www/ to the gh-pages branch on every push to main.
# GitHub Pages serves that branch (Settings -> Pages -> Deploy from a branch: gh-pages / root).
on:
  push:
    branches: [main]
    paths: ['www/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nightly data refresh writes data.json straight to gh-pages (see UPDATE.md): a deploy keeps the newer one,
      # so a new version never brings back older data
      - name: Keep the newer data.json from gh-pages
        run: |
          git fetch -q origin gh-pages || exit 0
          git show origin/gh-pages:data.json > /tmp/live.json 2>/dev/null || exit 0
          python3 - <<'PY'
          import json
          a = json.load(open('www/data.json'))
          try:
              b = json.load(open('/tmp/live.json'))
          except Exception:
              raise SystemExit
          if b.get('season') == a.get('season') and str(b.get('updated', '')) > str(a.get('updated', '')):
              if 'PBP' not in b and 'PBP' in a:
                  b['PBP'] = a['PBP']
              json.dump(b, open('www/data.json', 'w'), ensure_ascii=False)
              print('kept the newer data.json from gh-pages:', b.get('updated'))
          PY
      - name: Push www/ to gh-pages
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
