   else{s.them+=pt;s.run=0;s.plays.unshift({n:++s.n,q:s.q,sec:s.sec,u:0,t:`${pt===3?'שלשה':'סל'} של ${opp} (+${pt})`})}
   if(s.sec<=0){s.sec=0;nf.current(`סיום רבע ${s.q}: ${s.us}–${s.them}`,'league','quarter');
    if(s.q===4){s.done=1;nf.current(`סיום המשחק: ${s.us}–${s.them} ${s.us>s.them?'ניצחון להפועל!':'הפסד'}`,'league','quarter')}else{s.q++;s.sec=600;nf.current('פתיחת רבע '+s.q,'league','quarter')}}

 },[live]);

 <div class="fixed inset-x-0 z-[60] flex flex-col items-center gap-2 pointer-events-none" style=${{top:'calc(env(safe-area-inset-top,0px) + 64px)'}}>${toasts.map(t=>html`<div key=${t.id} class="pointer-events-auto bg-[#C8102E] text-white text-sm px-4 py-2 rounded-xl shadow-lg max-w-[92%]">🏀 ${t.t}</div>`)}</div>
 <main class="max-w-3xl mx-auto p-3 pb-28">${gm?html`<${Game} g=${gm}/>`:html`<${Pg}/>`}<div class="text-center text-[11px] mu mt-6">נתוני משחקים, טבלאות וסגל: 365scores · עונת ${SEASON} · נכון ל-${ASOF} · מוצרי החנות וכרטיס ה-QR להמחשה · <a href=${LINKS.club} target="_blank" rel="noopener noreferrer" class="underline">האתר הרשמי של הקבוצה</a></div></main>

 ${dr&&html`<${Drawer}/>`}<//>`;
}
